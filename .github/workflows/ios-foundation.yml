name: iOS foundation

on:
  pull_request:
    paths:
      - "ios/**"
      - "protocol/**"
      - ".github/workflows/ios-foundation.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "protocol/**"
      - ".github/workflows/ios-foundation.yml"

permissions:
  contents: read

concurrency:
  group: ios-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Validate shared protocol fixtures
        run: python3 protocol/validate_protocol.py

      - name: Lint Swift sources
        shell: bash
        run: |
          set -euo pipefail
          swift_sources=()
          while IFS= read -r -d '' source; do
            swift_sources+=("$source")
          done < <(find ios \( -path '*/.build' -o -path '*/.swiftpm' \) -prune -o -type f -name '*.swift' -print0)
          if (( ${#swift_sources[@]} == 0 )); then
            echo "No Swift sources found" >&2
            exit 1
          fi
          xcrun swift-format lint --strict --configuration ios/.swift-format "${swift_sources[@]}"

      - name: Validate app manifests and localized permission text
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint ios/App/Config/Info.plist
          plutil -lint ios/App/Resources/PrivacyInfo.xcprivacy
          test -f ios/App/Resources/InfoPlist.xcstrings
          test -f ios/App/Resources/Localizable.xcstrings
          string_catalogs=()
          while IFS= read -r -d '' file; do
            string_catalogs+=("$file")
          done < <(find ios/App/Resources -type f -name '*.xcstrings' -print0)
          if (( ${#string_catalogs[@]} == 0 )); then
            echo "No String Catalogs found" >&2
            exit 1
          fi
          for file in "${string_catalogs[@]}"; do
            python3 -m json.tool "$file" >/dev/null
          done

      - name: Test Swift packages
        shell: bash
        run: |
          set -euo pipefail
          packages=(ios)
          while IFS= read -r package; do
            packages+=("$package")
          done < <(find ios/Packages -mindepth 2 -maxdepth 2 -name Package.swift -print | sed 's#/Package.swift$##' | sort)
          for package in "${packages[@]}"; do
            echo "::group::swift test Debug $package"
            swift test --package-path "$package" -Xswiftc -warnings-as-errors
            echo "::endgroup::"
            echo "::group::swift test Release $package"
            swift test --package-path "$package" -c release -Xswiftc -warnings-as-errors
            echo "::endgroup::"
          done

      - name: Enforce MauryaProtocol line coverage
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path ios --enable-code-coverage -Xswiftc -warnings-as-errors
          coverage_json="$(swift test --package-path ios --show-codecov-path)"
          coverage_dir="$(dirname "$coverage_json")"
          profile="$coverage_dir/default.profdata"
          test_binary="$(find "$(dirname "$coverage_dir")" -type f -path '*PackageTests.xctest/Contents/MacOS/*PackageTests' -print -quit)"
          if [[ ! -f "$profile" || ! -x "$test_binary" ]]; then
            echo "SwiftPM coverage profile or test binary not found" >&2
            exit 1
          fi
          export_json="$RUNNER_TEMP/maurya-protocol-coverage.json"
          xcrun llvm-cov export "$test_binary" \
            -instr-profile="$profile" \
            -ignore-filename-regex='(/Tests/|/.build/)' > "$export_json"
          python3 - "$export_json" <<'PY'
          import json
          import pathlib
          import sys

          document = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          data = document["data"][0]
          total = float(data["totals"]["lines"]["percent"])
          if total < 95.0:
              raise SystemExit(f"MauryaProtocol total line coverage {total:.2f}% is below 95.00%")

          critical = {
              "ModbusCRC16.swift",
              "ModbusRequest.swift",
              "EffectProtocolCodec.swift",
              "OTAProtocolCodec.swift",
              "VendorEnvelopeCodec.swift",
              "VendorTLVCodec.swift",
          }
          coverage = {
              pathlib.Path(item["filename"]).name: float(item["summary"]["lines"]["percent"])
              for item in data["files"]
              if pathlib.Path(item["filename"]).name in critical
          }
          missing = critical - coverage.keys()
          if missing:
              raise SystemExit(f"Critical codec coverage entries missing: {sorted(missing)}")
          below = {name: percent for name, percent in coverage.items() if percent < 100.0}
          if below:
              raise SystemExit(f"Critical codec line coverage must be 100%: {below}")
          print(f"MauryaProtocol total line coverage: {total:.2f}%")
          for name in sorted(critical):
              print(f"{name}: {coverage[name]:.2f}%")
          PY

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_json="$({ xcrun simctl list devices available -j || true; })"
          device_id="$(printf '%s' "$simulator_json" | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          for runtime, devices in payload.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator")
          ' )"
          ipad_id="$(printf '%s' "$simulator_json" | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          fallback = None
          for runtime, devices in payload.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if not device.get("isAvailable"):
                      continue
                  name = device.get("name", "")
                  if name.startswith("iPad Pro 13-inch"):
                      print(device["udid"])
                      raise SystemExit(0)
                  if fallback is None and name.startswith("iPad"):
                      fallback = device["udid"]
          if fallback:
              print(fallback)
              raise SystemExit(0)
          raise SystemExit("No available iPad simulator")
          ' )"
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
          echo "ipad_id=$ipad_id" >> "$GITHUB_OUTPUT"

      - name: Test iOS app composition
        run: >-
          xcodebuild
          -project ios/App/Maurya.xcodeproj
          -scheme Maurya
          -configuration Debug
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}'
          -derivedDataPath "$RUNNER_TEMP/maurya-test-derived-data"
          -parallel-testing-enabled NO
          -only-testing:MauryaTests
          -only-testing:MauryaUITests
          SWIFT_SUPPRESS_WARNINGS=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          test

      - name: Test iPad landscape composition
        run: >-
          xcodebuild
          -project ios/App/Maurya.xcodeproj
          -scheme Maurya
          -configuration Debug
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.ipad_id }}'
          -derivedDataPath "$RUNNER_TEMP/maurya-ipad-test-derived-data"
          -parallel-testing-enabled NO
          -only-testing:MauryaUITests/MauryaUITests/testIPadProLandscapeKeepsSidebarAndMajorRoutesUsable
          -only-testing:MauryaUITests/MauryaUITests/testIPadSidebarIncludesShareAndKeepsItOffTheHomeScreen
          -only-testing:MauryaUITests/MauryaUITests/testScannerUnavailableRemainsRecoverableAcrossLandscapeAndLifecycle
          SWIFT_SUPPRESS_WARNINGS=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          test

      - name: Build unsigned iOS app configurations
        shell: bash
        run: |
          set -euo pipefail
          for configuration in Debug Staging Release; do
            echo "::group::generic iOS build $configuration"
            xcodebuild \
              -project ios/App/Maurya.xcodeproj \
              -scheme Maurya \
              -configuration "$configuration" \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/maurya-$configuration-derived-data" \
              CODE_SIGNING_ALLOWED=NO \
              SWIFT_SUPPRESS_WARNINGS=NO \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
              build
            echo "::endgroup::"
          done

      - name: Reject whitespace errors
        run: git diff --check
